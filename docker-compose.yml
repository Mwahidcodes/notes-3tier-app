services:
  db:
    image: postgres:16
    container_name: notes-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notesdb
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: notes-backend
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: notesdb
    ports:
      - "5000:5000"

  frontend:
  build: ./frontend
  container_name: notes-frontend
  ports:
    - "3000:5173"
  depends_on:
    - backend

volumes:
  postgres_data: